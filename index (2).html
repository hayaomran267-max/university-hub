<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Hub | Haya Omran</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Cairo:wght@400;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --bg: linear-gradient(135deg,#0f172a,#0b1120);
    --card-bg: rgba(255,255,255,0.06);
    --accent: #38bdf8;
    --text: white;
    --font: 'Poppins', 'Cairo', sans-serif;
}

/* ثيم الهكر */
body.hacker-mode {
    --bg: #000;
    --card-bg: rgba(0, 255, 65, 0.05);
    --accent: #00ff41;
    --text: #00ff41;
    --font: 'Fira Code', monospace;
}

*{margin:0;padding:0;box-sizing:border-box;font-family: var(--font)}

body{
    background: var(--bg);
    color: var(--text);
    min-height:100vh;
    direction: rtl;
    padding-bottom: 100px;
    transition: 0.5s;
}

header{ text-align:center; padding:50px 20px 20px; position: relative; }
header h1{ font-size:40px; background: linear-gradient(90deg, var(--accent), #818cf8); -webkit-background-clip:text; color:transparent; font-weight: 700;}

.tools-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; padding: 0 10px; }
.t-btn { 
    background: var(--card-bg); border: 1px solid var(--accent); color: var(--text); 
    padding: 8px 16px; border-radius: 12px; cursor: pointer; transition: 0.3s; font-size: 14px;
}
.t-btn:hover { background: var(--accent); color: black; box-shadow: 0 0 15px var(--accent); }

.tool-section {
    max-width: 500px; margin: 15px auto; background: var(--card-bg); 
    padding: 20px; border-radius: 20px; border: 1px solid var(--accent); display: none;
    backdrop-filter: blur(10px); animation: fadeIn 0.4s;
}

.container{ display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:20px; }
.card{
    background: var(--card-bg); border: 1px solid rgba(255,255,255,0.12);
    width:260px; padding:35px; border-radius:22px; text-align:center;
    cursor:pointer; transition:0.4s; backdrop-filter:blur(14px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: fadeInUp 0.6s ease forwards; font-weight: 600; text-decoration: none; color: white;
}
.card i { font-size: 40px; margin-bottom: 15px; color: var(--accent); }
.card:hover{ transform:translateY(-10px) scale(1.05); box-shadow:0 0 35px var(--accent); border-color: var(--accent); }

.todo-item { display: flex; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 10px; margin-top: 5px; border-radius: 8px; border-right: 3px solid var(--accent); }
#timer { font-size: 40px; font-weight: bold; text-align: center; margin: 10px 0; color: var(--accent); }
input { background: rgba(0,0,0,0.3); border: 1px solid var(--accent); color: white; padding: 10px; border-radius: 10px; width: 100%; margin-bottom: 10px; outline: none; }

.hidden{display:none;}
.subject-title{ text-align:center; font-size:32px; margin:20px 0; color:var(--accent); }
.back-btn { display:block; margin:20px auto; padding:12px 30px; border-radius:30px; background:var(--accent); color:black; font-weight:bold; border:none; cursor:pointer; transition: 0.3s; }
.back-btn:hover { background: #818cf8; transform: scale(1.05); }

footer { position: fixed; bottom: 0; width: 100%; text-align: center; padding: 15px; background: rgba(0,0,0,0.8); border-top: 1px solid var(--accent); z-index: 100;}

@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

@media(max-width:768px){ .card{width:90%; padding: 25px;} }
</style>
</head>
<body>

<header>
    <h1>University Hub</h1>
    <p>Study Smarter</p>
</header>

<div class="tools-nav">
    <button class="t-btn" onclick="toggleTheme()"><i class="fas fa-user-secret"></i> ثيم الهكر</button>
    <button class="t-btn" onclick="toggleSection('gpa-box')"><i class="fas fa-calculator"></i> المعدل (4.0)</button>
    <button class="t-btn" onclick="toggleSection('todo-box')"><i class="fas fa-list-check"></i> المهام</button>
    <button class="t-btn" onclick="toggleSection('pomodoro-box')"><i class="fas fa-clock"></i> بومودورو</button>
    <button class="t-btn" onclick="toggleMusic()"><i class="fas fa-music"></i> <span id="music-text">موسيقى التركيز</span></button>
</div>

<div id="gpa-box" class="tool-section">
    <h3 style="text-align:center; margin-bottom:10px;">حساب المعدل التراكمي</h3>
    <div id="subjects-input">
        <div style="display:flex; gap:5px; margin-bottom:5px;">
            <input type="number" step="0.01" placeholder="النقاط (مثلاً 3.75)" class="grade">
            <input type="number" placeholder="الساعات" class="hours">
        </div>
    </div>
    <button class="t-btn" style="width:100%" onclick="addSubjectRow()">+ إضافة مادة</button>
    <button class="t-btn" style="width:100%; margin-top:5px; background:var(--accent); color:black;" onclick="calculateGPA()">احسب المعدل</button>
    <div id="gpa-result" style="text-align:center; margin-top:10px; font-weight:bold; font-size: 1.2rem;"></div>
</div>

<div id="todo-box" class="tool-section">
    <h3 style="text-align:center; margin-bottom:10px;">قائمة المهام 📝</h3>
    <div style="display:flex; gap:5px;">
        <input type="text" id="todo-input" placeholder="شو بدك تدرسي اليوم؟" style="margin-bottom:0;">
        <button class="t-btn" onclick="addTodo()">إضافة</button>
    </div>
    <div id="todo-list" style="margin-top:15px;"></div>
</div>

<div id="pomodoro-box" class="tool-section">
    <h3 style="text-align:center;">مؤقت بومودورو ⏳</h3>
    <div id="timer">25:00</div>
    <div style="display:flex; justify-content:center; gap:10px;">
        <button class="t-btn" onclick="startTimer()">ابدأ</button>
        <button class="t-btn" onclick="resetTimer()">تصفير</button>
    </div>
</div>

<audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3" type="audio/mpeg">
</audio>

<div id="home" class="container">
    <div class="card" onclick="openSubject('Calculus I')"><i class="fas fa-infinity"></i>Calculus I</div>
    <div class="card" onclick="openSubject('حسابات')"><i class="fas fa-calculator"></i>حسابات</div>
    <div class="card" onclick="openSubject('احتمالات')"><i class="fas fa-chart-pie"></i>احتمالات</div>
    <div class="card" onclick="openSubject('مبادئ برمجة 1')"><i class="fas fa-code"></i>مبادئ برمجة 1</div>
    <div class="card" onclick="openSubject('مبادئ برمجة 2')"><i class="fas fa-laptop-code"></i>مبادئ برمجة 2</div>
    <div class="card" onclick="openSubject('الرياضيات المنفصلة')"><i class="fas fa-skull"></i>الرياضيات المنفصله ☠️</div>
    <div class="card" onclick="openSubject('فيزياء')"><i class="fas fa-atom"></i>فيزياء</div>
</div>

<div id="subjectPage" class="hidden">
    <h2 class="subject-title" id="subjectName"></h2>
    <div class="container" id="subjectContent"></div>
    <button class="back-btn" onclick="goBack()">← رجوع</button>
</div>

<footer>
    <p>Developed & Designed by <span style="color:var(--accent); font-weight:bold;">Haya Omran</span></p>
</footer>

<script>
let historyStack = [];

// محتوى المواد دمجت فيه كل الروابط اللي بعثتيها بالكود الأخير

"مبادئ برمجة 2": `

<div class="card" onclick="openSubMenu('lectures')"><i class="fas fa-video"></i>🎥 محاضرات مسجلة</div>

"حسابات": `

<a class="card" href="https://drive.google.com/drive/folders/1R8plVwFDFNl2GpiF9Mx9AsjxltvEQsAS" target="_blank"><i class="fas fa-file-powerpoint"></i>📊 سلايدات</a>
<a class="card" href="https://drive.google.com/drive/folders/1jklil1kK90ICz6uG0dj5ezClQ0RDRaYv" target="_blank"><i class="fas fa-question-circle"></i>📝 أسئلة المساق</a>

"احتمالات": `
<a class="card" href="https://drive.google.com/drive/folders/11CkkFM7jGVO_MMAxKLBv2BXc4psQB9EW" target="_blank"><i class="fas fa-video"></i>🎥 محاضرات مسجلة</a>
<a class="card" href="https://drive.google.com/drive/folders/1IaBPdwqH1S0flFeQwosrZ_ceMrNNThC-" target="_blank"><i class="fas fa-file-pdf"></i>📊 سلايدات</a>
`
};

function openSubject(name){
    historyStack = [];
    document.getElementById("home").classList.add("hidden");
    document.getElementById("subjectPage").classList.remove("hidden");
    document.getElementById("subjectName").innerText=name;
    document.getElementById("subjectContent").innerHTML=subjects[name];
    window.scrollTo(0,0);
}

function openSubMenu(type){
    historyStack.push(document.getElementById("subjectContent").innerHTML);
    let content = "";
    
    // تفريعات المنفصلة
    if(type==="discrete_slides") content=`<a class="card" href="https://drive.google.com/drive/folders/1CeWuU7HPXY-CJ7RT0vx3a0Vi6EyoGFtq" target="_blank">👩‍🏫 سلايدات د. مي</a>`;
    if(type==="discrete_lectures") content=`<a class="card" href="https://youtube.com/playlist?list=PLg9wrIfTPI6OUY8vUUDqiH9X_ua9xNl4R&si=CAkzr2ghyEOdy-VO" target="_blank">👩‍🏫 د. مي كنعان</a><a class="card" href="https://youtube.com/playlist?list=PLxIvc-MGOs6gZlMVYOOEtUHJmfUquCjwz&si=bKW95o_kcxNjH8Ks" target="_blank">📺 محاضرات المصري</a>`;
    
    // تفريعات Calculus
    if(type==="calc_slides") content=`<a class="card" href="https://drive.google.com/drive/folders/1a7QNz2N7K5OLNx584FJ3z2w0hZdqi1Wm" target="_blank">👨‍🏫 سلايدات د. عدنان</a><a class="card" href="https://drive.google.com/drive/folders/1CLAD-A0HMDDwWnr3TXicAFXBKRd3AjEH" target="_blank">✅ حلول د. عدنان</a>`;

    if(type==="calc_summaries") content=`<a class="card" href="https://drive.google.com/drive/folders/1iG6qEeMjVFt0ge3wazB4m1teV0QEKr3T" target="_blank">📄 ملخص 1</a><a class="card" href="https://drive.google.com/drive/u/2/folders/1VkD6PoJutJTRyR-rbcN_gV5ntSGpXDuU" target="_blank">📄 ملخص 2</a><a class="card" href="https://drive.google.com/drive/u/2/folders/1Biz4nuvcB5ymfVX0XJOuUIeadIaD3q9D" target="_blank">📄 ملخص 3</a>`;
    if(type==="calc_questions") content=`<a class="card" href="https://drive.google.com/drive/folders/1CnV_tCi9nkQsKxcuwpmZJv3-rx-ljN89" target="_blank">🥇 First</a><a class="card" href="https://drive.google.com/drive/u/2/folders/1NFPWkHUmCKVAyxqEHFSNdwdZrNnrEr0v" target="_blank">🥈 Second</a><a class="card" href="https://drive.google.com/drive/u/2/folders/1Z90j_nXB_dwecuUUIstqVBxiqZNrbT38" target="_blank">🎓 Final</a>`;

    // تفريعات الفيزياء
    if(type==="physics_slides") content=`<a class="card" href="https://moodle.najah.edu/pluginfile.php/2469515/mod_resource/content/0/General%20Physics%20IT%20Dr%20Hadil%20Abualrob.pdf" target="_blank">📄 د. هديل</a><a class="card" href="https://drive.google.com/drive/folders/1bwzBYsywtuVsPFt-8yonzYi3Xzhnysx1" target="_blank">📄 د. اياد</a>`;
    if(type==="physics_lectures") content=`<a class="card" href="https://drive.google.com/drive/folders/1Jy1QlE_eA9jc2XAczRMJmuPRdJ4Ho7L6" target="_blank">👨‍🏫 د. اياد</a><a class="card" href="https://drive.google.com/drive/folders/1qy0dY1FbSLzmeDDxWsE88gxbaiCDPdqN" target="_blank">👩‍🏫 د. ديانا</a>`;
    if(type==="physics_questions") content=`<a class="card" href="https://drive.google.com/drive/u/2/folders/1firvizDtE7TuXlilH2UE0QStjG4iZqJA" target="_blank">📘 فاينل 1</a><a class="card" href="https://drive.google.com/drive/u/2/folders/1qy0dY1FbSLzmeDDxWsE88gxbaiCDPdqN" target="_blank">📘 فاينل 2</a>`;

    if(type==="questions") content=`<div class="card" onclick="openSubMenu('second')">📘 Second</div><a class="card" href="https://drive.google.com/file/d/146uRXwl3tHfu_J-XLL1jdXnUmrjnAqF-/view" target="_blank">📝 Midterm</a><div class="card" onclick="openSubMenu('final')">🎓 Final</div>`;
    if(type==="second") content=`<a class="card" href="https://drive.google.com/drive/folders/1UKX5cnbdfp_yOkrnewYnhGzJWGNmhdFQ" target="_blank">1</a><a class="card" href="https://drive.google.com/drive/folders/1Ayg4xOhQM3pI5JFS3Xk0zYUPC6l-gSYa" target="_blank">2</a>`;
    if(type==="final") content=`<a class="card" href="https://drive.google.com/drive/folders/1cQ1L6T_Zsf7UdjYsx1JikmkPWfayiE07" target="_blank">1</a><a class="card" href="https://docs.google.com/file/d/1EP_C8_TF7OqMJV8iKbl3qQbHKbTemOA5/edit" target="_blank">2</a>`;

    document.getElementById("subjectContent").innerHTML=content;
}

function goBack(){
    if(historyStack.length>0) document.getElementById("subjectContent").innerHTML=historyStack.pop();
    else { document.getElementById("subjectPage").classList.add("hidden"); document.getElementById("home").classList.remove("hidden"); }
}

function toggleSection(id) {
    let sections = document.querySelectorAll('.tool-section');
    sections.forEach(s => { if(s.id !== id) s.style.display = 'none'; });
    let el = document.getElementById(id);
    el.style.display = (el.style.display === 'block') ? 'none' : 'block';
}

function toggleTheme() { document.body.classList.toggle('hacker-mode'); }

function addTodo() {
    let val = document.getElementById("todo-input").value;
    if(!val) return;
    let item = document.createElement("div");
    item.className = "todo-item";
    item.innerHTML = `<span>${val}</span><i class="fas fa-trash" onclick="this.parentElement.remove()" style="cursor:pointer; color:red;"></i>`;
    document.getElementById("todo-list").appendChild(item);
    document.getElementById("todo-input").value = "";
}

let timerInterval;
function startTimer() {
    let time = 25 * 60;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        let mins = Math.floor(time / 60);
        let secs = time % 60;
        document.getElementById("timer").innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        if (time-- <= 0) { clearInterval(timerInterval); alert("وقت الراحة!"); }
    }, 1000);
}
function resetTimer() { clearInterval(timerInterval); document.getElementById("timer").innerText = "25:00"; }

function toggleMusic() {
    let m = document.getElementById("bg-music");
    let txt = document.getElementById("music-text");
    if(m.paused) { m.play(); txt.innerText = "إيقاف الموسيقى"; }
    else { m.pause(); txt.innerText = "موسيقى التركيز"; }
}

function addSubjectRow() {
    let row = document.createElement('div');
    row.style.display = "flex"; row.style.gap = "5px"; row.style.marginBottom = "5px";
    row.innerHTML = '<input type="number" step="0.01" placeholder="النقاط" class="grade"><input type="number" placeholder="الساعات" class="hours">';
    document.getElementById("subjects-input").appendChild(row);
}

function calculateGPA() {
    let gs = document.querySelectorAll(".grade"), hs = document.querySelectorAll(".hours");
    let tp = 0, th = 0;
    gs.forEach((g, i) => { if(g.value && hs[i].value) { tp += parseFloat(g.value) * parseFloat(hs[i].value); th += parseFloat(hs[i].value); } });
    document.getElementById("gpa-result").innerText = th > 0 ? "معدلك: " + (tp/th).toFixed(2) : "يرجى إدخال البيانات";
}
</script>
</body>
</html>
